name: Album 3D - Testes e compilacao

on:
  push:
    branches:
      - 'feat/album-compartilhado-supabase'
    paths:
      - 'examples/album-de-memorias-3d/**'
      - '.github/workflows/album-3d-ci.yml'
  pull_request:
    paths:
      - 'examples/album-de-memorias-3d/**'
      - '.github/workflows/album-3d-ci.yml'

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/album-de-memorias-3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Testar
        run: npm test
      - name: Compilar
        run: npm run build
