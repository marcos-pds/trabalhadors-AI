name: Tests (local workspace)
on:
  push:
    branches:
      - feat/local-project-workspaces
      - feat/chat-first-slash-integrated
      - feat/gemini-visual-minimalista
  pull_request:
    branches:
      - main
      - feat/local-project-workspaces
      - feat/uiux-skills-architect-autonomy
      - feat/chat-first-slash-integrated
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Validate frontend JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/slash-commands.mjs
          node --check static/ui-icons.mjs
      - name: Test chat slash commands
        run: node --test tests/test_slash_commands.cjs tests/test_chat_first.cjs tests/test_gemini_theme.cjs
