name: Build Central Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - feat/desktop-clean-exe-installer
      - feat/installer-optional-models
      - fix/desktop-pink-slime-reactions
      - feat/desktop-full-liquid-glass-theme
      - feat/desktop-github-release-updater
      - feat/desktop-chat-prompt-first
      - fix/desktop-chat-glass-preview
      - fix/desktop-borderless-clean-chat
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - 'central/**'
      - 'package*.json'
      - 'requirements.txt'
      - '.github/workflows/build-desktop-installer.yml'

permissions:
  contents: read

jobs:
  setup-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate optional component PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $syntaxErrors = $null
          $file = (Resolve-Path 'desktop/build/optional-components.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$syntaxErrors) | Out-Null
          if ($syntaxErrors.Count -gt 0) {
            $syntaxErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'Optional component script parsed successfully'

      - name: Build real offline installer (Python + React + Electron)
        shell: pwsh
        run: ./desktop/build_windows.ps1

      - name: Smoke test packaged Python server on localhost
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'dist\backend\central-backend\central-backend.exe'
          if (-not (Test-Path $exe)) { throw 'Bundled backend was not produced' }
          $env:CENTRAL_PORT = '18887'
          $env:CENTRAL_DATA_DIR = Join-Path $env:RUNNER_TEMP 'central-desktop-smoke'
          $env:CENTRAL_DEPLOYMENT_MODE = 'local'
          $env:CENTRAL_JOB_MODE = 'embedded'
          $proc = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i=0; $i -lt 50; $i++) {
              if ($proc.HasExited) { throw "Bundled backend exited with code $($proc.ExitCode)" }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:18887/' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match '<html') {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 800
            }
            if (-not $ready) { throw 'Bundled backend did not serve the built React UI' }
            Write-Host 'Packaged server returned valid HTML'
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Verify GitHub update manifest
        shell: pwsh
        run: |
          $metadata = 'desktop/release/latest.yml'
          if (-not (Test-Path $metadata)) { throw 'latest.yml is required for GitHub auto updates' }
          $text = Get-Content $metadata -Raw
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($text -notmatch 'sha512:' -or $text -notmatch [regex]::Escape($version)) {
            throw 'latest.yml must describe the exact signed update and SHA512 digest'
          }
          Write-Host 'GitHub update manifest generated correctly'

      - name: Check installer and SHA256
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem 'desktop/release/Central-Setup-*.exe')
          if ($installers.Count -ne 1) { throw "Expected one Setup EXE, found $($installers.Count)" }
          if ($installers[0].Length -lt 20000000) { throw 'Setup appears incomplete' }
          Get-FileHash $installers[0].FullName -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: Central-Setup-Windows-x64
          path: |
            desktop/release/Central-Setup-*.exe
            desktop/release/latest.yml
            desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
