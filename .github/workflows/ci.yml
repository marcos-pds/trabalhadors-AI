name: Central IA checks

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
        node-version: ["22"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check Python syntax
        run: python -m compileall -q central
      - name: Build React frontend
        run: npm run build
      - name: Run regression and autonomy tests
        id: pytests
        shell: bash
        run: |
          set +e
          python -m pytest -q > pytest-output.txt 2>&1
          rc=$?
          cat pytest-output.txt
          if [ "$rc" -ne 0 ]; then
            summary=$(grep -E '^(FAILED|ERROR) ' pytest-output.txt | head -n 2 | cut -c1-130 | paste -sd ';' -)
            if [ -z "$summary" ]; then summary='pytest failed: consult workflow logs'; fi
            printf 'failures=%s\n' "$summary" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"
      - name: Record failed test names on commit
        if: failure() && steps.pytests.outputs.failures != ''
        uses: actions/github-script@v7
        env:
          TEST_FAILURES: ${{ steps.pytests.outputs.failures }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'pytest/${{ matrix.os }}',
              description: (process.env.TEST_FAILURES || 'pytest failed').slice(0, 140)
            })
      - name: Test connection stream parser
        run: node --test frontend/src/catalogConnectionStream.test.mjs


  docker-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Build isolated executor and dependency proxy
        run: |
          docker version
          docker build -f sandbox/Dockerfile -t central-ai-executor:py311-node22 sandbox
          docker build -f sandbox/Dockerfile.egress -t central-ai-egress:py311-v1 sandbox
      - name: Validate real Docker network, packages and preview
        env:
          CENTRAL_DOCKER_INTEGRATION: "1"
        run: python -m pytest tests/test_docker_integration.py -v --tb=short
